<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>InvestCap</title>
  <meta name="theme-color" content="#0a0e0b">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" type="image/png" href="/icons/icon-192.png">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="InvestCap">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <script>try{var t=localStorage.getItem("investcap.theme");if(t==="light"||t==="dark")document.documentElement.dataset.theme=t}catch(e){}</script>
  <link rel="stylesheet" href="styles.css?v=10">
</head>
<body>
  <div class="app">
    <aside class="sidebar" aria-label="Primary">
      <div class="brand"><span class="logo">IC</span><span class="brand-name">InvestCap</span></div>
      <nav class="nav">
        <a href="#overview" class="active" data-nav><svg viewBox="0 0 24 24"><path d="M3 12 12 4l9 8M5 10v10h5v-6h4v6h5V10"/></svg>Overview</a>
        <a href="#portfolio" data-nav><svg viewBox="0 0 24 24"><path d="M3 7h18v13H3zM8 7V4h8v3"/></svg>Portfolio</a>
        <a href="#watchlist" data-nav><svg viewBox="0 0 24 24"><path d="m12 3 2.8 5.8 6.2.9-4.5 4.4 1.1 6.2L12 17.3 6.4 20.3l1.1-6.2L3 9.7l6.2-.9z"/></svg>Watchlist</a>
        <a href="#news" data-nav><svg viewBox="0 0 24 24"><path d="M4 5h13v14H4zM17 9h3v8a2 2 0 0 1-2 2M7 9h7M7 13h7"/></svg>News</a>
      </nav>
      <div class="side-foot">Sample data · not financial advice</div>
    </aside>

    <main class="main">
      <header class="topbar">
        <div class="search">
          <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>
          <input id="search" type="search" placeholder="Search stocks, ETFs…" autocomplete="off" aria-label="Search">
          <ul id="search-results" class="search-results" hidden></ul>
        </div>
        <div class="market-status"><span class="dot"></span><span id="market-label">Market open</span></div>
        <div class="theme-switch" id="theme-switch" role="group" aria-label="Appearance">
          <button data-theme="light" aria-pressed="false" title="Light"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6 7 7M17 17l1.4 1.4M5.6 18.4 7 17M17 7l1.4-1.4"/></svg><span>Light</span></button>
          <button data-theme="dark" aria-pressed="false" title="Dark"><svg viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 0 1 9.5 4 8 8 0 1 0 20 14.5z"/></svg><span>Dark</span></button>
          <button data-theme="auto" aria-pressed="true" title="Match system"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/></svg><span>Auto</span></button>
        </div>
      </header>

      <section id="overview" class="section">
        <div class="hero card">
          <div class="hero-top">
            <div>
              <p class="label">Portfolio value</p>
              <h1 id="total-value" class="big">$0.00</h1>
              <p id="total-change" class="change">+$0.00 (0.00%) <span class="muted">today</span></p>
              <p id="range-change" class="small range-change"></p>
            </div>
            <div class="range" id="range" role="tablist" aria-label="Chart range">
              <button data-r="1D" class="on">1D</button><button data-r="1W">1W</button><button data-r="1M">1M</button><button data-r="3M">3M</button><button data-r="1Y">1Y</button><button data-r="2Y">2Y</button><button data-r="5Y">5Y</button><button data-r="10Y">10Y</button>
            </div>
          </div>
          <div id="chart" class="chart"></div>
        </div>

        <div id="indices" class="indices"></div>
      </section>

      <div class="cols">
        <section id="portfolio" class="section">
          <div class="section-head">
            <h2>Portfolio</h2>
            <div class="head-actions">
              <button id="metric-pill" class="pill-btn" aria-haspopup="dialog"><span id="metric-label">1D return</span><svg viewBox="0 0 24 24"><path d="M4 7h16M7 12h10M10 17h4"/></svg></button>
              <button id="open-sheet" class="icon-btn" aria-label="Filter and sort"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19 12a7 7 0 0 0-.1-1.2l2-1.5-2-3.4-2.3 1a7 7 0 0 0-2-1.2L14.2 3h-4l-.4 2.7a7 7 0 0 0-2 1.2l-2.3-1-2 3.4 2 1.5a7 7 0 0 0 0 2.4l-2 1.5 2 3.4 2.3-1a7 7 0 0 0 2 1.2l.4 2.7h4l.4-2.7a7 7 0 0 0 2-1.2l2.3 1 2-3.4-2-1.5c.1-.4.1-.8.1-1.2z"/></svg></button>
            </div>
          </div>
          <div id="holdings"></div>
        </section>

        <aside class="side-col">
          <section id="detail" class="section"></section>
        </aside>
      </div>

      <div class="cols">
        <section id="watchlist" class="section">
          <div class="section-head"><h2>Watchlist</h2><span class="muted small">Tap + to add to portfolio</span></div>
          <div id="watch" class="card list"></div>
        </section>
        <section id="news" class="section">
          <div class="section-head"><h2>Market news</h2></div>
          <div id="news-list" class="card list"></div>
        </section>
      </div>
    </main>

    <nav class="tabbar" aria-label="Primary mobile">
      <a href="#overview" data-nav class="active"><svg viewBox="0 0 24 24"><path d="M3 12 12 4l9 8M5 10v10h5v-6h4v6h5V10"/></svg><span>Overview</span></a>
      <a href="#portfolio" data-nav><svg viewBox="0 0 24 24"><path d="M3 7h18v13H3zM8 7V4h8v3"/></svg><span>Portfolio</span></a>
      <a href="#watchlist" data-nav><svg viewBox="0 0 24 24"><path d="m12 3 2.8 5.8 6.2.9-4.5 4.4 1.1 6.2L12 17.3 6.4 20.3l1.1-6.2L3 9.7l6.2-.9z"/></svg><span>Watchlist</span></a>
      <a href="#news" data-nav><svg viewBox="0 0 24 24"><path d="M4 5h13v14H4zM17 9h3v8a2 2 0 0 1-2 2M7 9h7M7 13h7"/></svg><span>News</span></a>
    </nav>
  </div>

  <div id="overlay" class="overlay" hidden></div>

  <!-- Filter & sort sheet -->
  <div id="sheet" class="sheet" role="dialog" aria-modal="true" aria-label="Filter and sort" hidden>
    <div class="grab"></div>
    <div class="seg" id="sheet-tabs">
      <button class="on" data-tab="filter">Filter &amp; sort</button><button data-tab="groups">Groups</button><button data-tab="sections">Sections</button>
    </div>
    <div id="sheet-body"></div>
    <button id="sheet-done" class="cta">Apply</button>
  </div>

  <!-- Buy order modal -->
  <div id="order" class="sheet order" role="dialog" aria-modal="true" aria-label="Buy order" hidden></div>

  <div id="toast" class="toast" role="status" hidden></div>

  <script src="data.js?v=10"></script>
  <script src="app.js?v=10"></script>
</body>
</html>
